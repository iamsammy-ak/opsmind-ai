[project]
name = "opsmind-ai"
version = "0.1.0"
description = "Operations intelligence: process mining, KPI control charts and Lean waste mapping, with an AI improvement planner."
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
